[package]
name = "homelab"
version = "0.1.0"
edition = "2021"

[features]
sandbox-check = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.12.5", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "time", "process", "io-util", "sync", "macros", "rt-multi-thread"] }
futures = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSWindow", "NSView", "NSResponder", "NSAlert", "NSButton", "NSControl", "block2"] }
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSURLAuthenticationChallenge", "NSURLProtectionSpace", "NSURLCredential", "NSURLSession"] }
objc2-web-kit = { version = "0.3", features = ["WKNavigationDelegate", "WKWebView"] }
security-framework = { version = "3", features = ["macos-12"] }
core-foundation = "0.10"
sha2 = "0.10"
x509-parser = "0.18"

objc2-security = { version = "0.3", features = ["SecTrust"] }
